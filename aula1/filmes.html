<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Avaliador de Filmes</title>
  <link rel="stylesheet" href="estilo.css" />
</head>
<body>
  <h1>Avaliador de Filmes</h1>
  <p id="resumo">0 de 3 avaliados</p>

  <main class="lista">
    <article class="filme">
      <h2>Interestelar</h2>
      <p>2014</p>
      <input type="range" min="1" max="5" />
      <p class="nota">Sem nota</p>
    </article>

    <article class="filme">
      <h2>Parasita</h2>
      <p>2019</p>
      <input type="range" min="1" max="5" />
      <p class="nota">Sem nota</p>
    </article>

    <article class="filme">
      <h2>Matrix</h2>
      <p>1999</p>
      <input type="range" min="1" max="5" />
      <p class="nota">Sem nota</p>
    </article>
  </main>
  <script src="script.js"></script>
</body>
</html>
